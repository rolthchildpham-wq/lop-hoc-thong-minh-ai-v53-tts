name: Build Android V5.3.7 Complete Offline TTS APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout V5.3.3 source
        uses: actions/checkout@v4

      - name: Bundle all offline web dependencies
        shell: bash
        run: |
          set -euxo pipefail
          WEB=app/src/main/assets/www
          mkdir -p "$WEB/vendor/hanzi-writer-data"
          cp index.html "$WEB/index.html"
          curl --fail --location --retry 4 --retry-all-errors https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js --output "$WEB/vendor/firebase-app-compat.js"
          curl --fail --location --retry 4 --retry-all-errors https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js --output "$WEB/vendor/firebase-auth-compat.js"
          curl --fail --location --retry 4 --retry-all-errors https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js --output "$WEB/vendor/firebase-database-compat.js"
          curl --fail --location --retry 4 --retry-all-errors https://cdn.jsdelivr.net/npm/hanzi-writer@3.7.3/dist/hanzi-writer.min.js --output "$WEB/vendor/hanzi-writer.min.js"
          curl --fail --location --retry 4 --retry-all-errors https://registry.npmjs.org/hanzi-writer-data/-/hanzi-writer-data-2.0.1.tgz --output /tmp/hanzi-writer-data.tgz
          mkdir -p /tmp/hanzi-writer-data
          tar -xzf /tmp/hanzi-writer-data.tgz -C /tmp/hanzi-writer-data
          find /tmp/hanzi-writer-data/package -type f -name '*.json' -exec cp {} "$WEB/vendor/hanzi-writer-data/" \;
          test -s "$WEB/index.html"
          test -s "$WEB/vendor/firebase-app-compat.js"
          test -s "$WEB/vendor/firebase-auth-compat.js"
          test -s "$WEB/vendor/firebase-database-compat.js"
          test -s "$WEB/vendor/hanzi-writer.min.js"
          test "$(find "$WEB/vendor/hanzi-writer-data" -type f -name '*.json' | wc -l)" -gt 5000
          echo "Bundled offline Hanzi stroke files: $(find "$WEB/vendor/hanzi-writer-data" -type f -name '*.json' | wc -l)"

      - name: Run offline browser regression tests
        shell: bash
        run: |
          set -euxo pipefail
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node scripts/test-offline-browser.cjs

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Download Sherpa-ONNX Android runtime
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p app/libs
          curl --fail --location --retry 4 --retry-all-errors \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/sherpa-onnx-2.0.1.aar \
            --output app/libs/sherpa-onnx-2.0.1.aar
          test -s app/libs/sherpa-onnx-2.0.1.aar
          unzip -t app/libs/sherpa-onnx-2.0.1.aar >/dev/null
          ls -lh app/libs/sherpa-onnx-2.0.1.aar

      - name: Download and bundle English offline voice
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/en-model app/src/main/assets/tts/en
          mkdir -p /tmp/en-model app/src/main/assets/tts/en
          curl --fail --location --retry 4 --retry-all-errors \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-en_US-lessac-medium.tar.bz2 \
            --output /tmp/en.tar.bz2
          tar -xjf /tmp/en.tar.bz2 -C /tmp/en-model
          cp -a /tmp/en-model/vits-piper-en_US-lessac-medium/. app/src/main/assets/tts/en/
          rm -rf app/src/main/assets/tts/en/test_wavs
          find app/src/main/assets/tts/en -type f -name '*.wav' -delete
          test -s app/src/main/assets/tts/en/en_US-lessac-medium.onnx
          test -s app/src/main/assets/tts/en/tokens.txt
          # Piper requires the English pronunciation lexicon as a separate release asset.
          curl --fail --location --retry 4 --retry-all-errors https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/lexicon-en-us.txt --output app/src/main/assets/tts/en/lexicon.txt
          test -s app/src/main/assets/tts/en/lexicon.txt
          ls -lh app/src/main/assets/tts/en/en_US-lessac-medium.onnx

      - name: Download and bundle Chinese offline voice
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/zh-model app/src/main/assets/tts/zh
          mkdir -p /tmp/zh-model app/src/main/assets/tts/zh
          curl --fail --location --retry 4 --retry-all-errors \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/kokoro-multi-lang-v1_0.tar.bz2 \
            --output /tmp/zh.tar.bz2
          tar -xjf /tmp/zh.tar.bz2 -C /tmp/zh-model
          cp -a /tmp/zh-model/kokoro-multi-lang-v1_0/. app/src/main/assets/tts/zh/
          rm -rf app/src/main/assets/tts/zh/test_wavs
          find app/src/main/assets/tts/zh -type f -name '*.wav' -delete
          test -s app/src/main/assets/tts/zh/model.onnx
          test -s app/src/main/assets/tts/zh/voices.bin
          test -s app/src/main/assets/tts/zh/tokens.txt
          test -s app/src/main/assets/tts/zh/lexicon-zh.txt
          ls -lh app/src/main/assets/tts/zh/model.onnx app/src/main/assets/tts/zh/voices.bin

      - name: Verify bundled voice assets
        shell: bash
        run: |
          set -euxo pipefail
          du -sh app/src/main/assets/tts
          find app/src/main/assets/tts -maxdepth 2 -type f -printf '%p %s bytes\n' | sort
          test -s app/src/main/assets/tts/en/en_US-lessac-medium.onnx
          test -s app/src/main/assets/tts/zh/model.onnx
          test -s app/src/main/assets/tts/zh/voices.bin

      - name: Build V5.3.7 debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK and bundled model names
        shell: bash
        run: |
          set -euxo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -E 'assets/tts/(en/en_US-lessac-medium.onnx|zh/model.onnx|zh/voices.bin)'
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lop-Hoc-Thong-Minh-AI-V5.3.7-COMPLETE-OFFLINE-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
