plugins { id 'com.android.application' }

android {
    namespace 'vn.aihuedan.learn'
    compileSdk 35

    defaultConfig {
        applicationId 'vn.aihuedan.learn'
        minSdk 26
        targetSdk 35
        versionCode 534
        versionName '5.3.4'

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        release { minifyEnabled false }
    }

    androidResources {
        noCompress += ['onnx', 'bin', 'txt', 'fst']
    }
}

dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.0.21'
    implementation files('libs/sherpa-onnx-2.0.1.aar')
}
